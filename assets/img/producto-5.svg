<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img"
     aria-label="Especificaciones: 1000 vatios, tecnología cerámica y ondas suaves">

  <defs>
    <linearGradient id="gMango" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="45%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gBarril" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="40%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gRosa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="55%" stop-color="#FB2E71"/>
      <stop offset="100%" stop-color="#C81355"/>
    </linearGradient>
    <linearGradient id="gCaja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="#ffffff"/>
  <text x="120" y="150" font-family="Arial, sans-serif" font-size="62" font-weight="bold"
        fill="#101010" letter-spacing="8">LISAPRO</text>

  <g transform="translate(170 300)">
    <circle cx="0" cy="0" r="66" fill="none" stroke="#101010" stroke-width="2"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
          fill="#101010" text-anchor="middle">Salon Blowout</text>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="9"
          fill="#757575" text-anchor="middle">in up to Half the Time</text>
  </g>
  <g transform="translate(380 300)">
    <circle cx="0" cy="0" r="66" fill="none" stroke="#101010" stroke-width="2"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
          fill="#101010" text-anchor="middle">1000W</text>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="9"
          fill="#757575" text-anchor="middle">Potencia profesional</text>
  </g>
  <g transform="translate(170 510)">
    <circle cx="0" cy="0" r="66" fill="none" stroke="#101010" stroke-width="2"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
          fill="#101010" text-anchor="middle">Ceramic</text>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="9"
          fill="#757575" text-anchor="middle">Technology</text>
  </g>
  <g transform="translate(380 510)">
    <circle cx="0" cy="0" r="66" fill="none" stroke="#101010" stroke-width="2"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
          fill="#101010" text-anchor="middle">Soft Curls</text>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="9"
          fill="#757575" text-anchor="middle">and Volume</text>
  </g>
  
  <g transform="translate(560 190) scale(1.02) rotate(0)">
    <!-- cable -->
    <path d="M60 470 C 20 500, 105 520, 70 552" fill="none" stroke="#101010"
          stroke-width="7" stroke-linecap="round"/>
    <rect x="48" y="548" width="30" height="20" rx="4" fill="#101010"/>

    <!-- mango -->
    <path d="M38 300 L82 300 L78 470 Q60 486 42 470 Z" fill="url(#gMango)"/>
    <!-- controles del mango -->
    <rect x="47" y="330" width="26" height="7" rx="3.5" fill="#FB2E71"/>
    <rect x="47" y="345" width="26" height="7" rx="3.5" fill="#3a3a3a"/>
    <rect x="47" y="360" width="26" height="7" rx="3.5" fill="#3a3a3a"/>
    <text x="60" y="392" font-family="Arial, sans-serif" font-size="9"
          fill="#8a8a8a" text-anchor="middle" letter-spacing="1">LISAPRO</text>

    <!-- collar rosado -->
    <path d="M32 262 L88 262 L84 306 L36 306 Z" fill="url(#gRosa)"/>
    <ellipse cx="60" cy="262" rx="28" ry="7" fill="#FF6B9D"/>

    <!-- barril -->
    <rect x="26" y="86" width="68" height="180" rx="34" fill="url(#gBarril)"/>
    <rect x="38" y="96" width="20" height="160" rx="10" fill="#2a2a2a" opacity="0.55"/>

    <!-- cerdas: filas laterales -->
    <g stroke="#101010" stroke-width="3.4" stroke-linecap="round">
      <line x1="26" y1="100" x2="6" y2="97"/><line x1="26" y1="115" x2="6" y2="112"/><line x1="26" y1="130" x2="6" y2="127"/><line x1="26" y1="145" x2="6" y2="142"/><line x1="26" y1="160" x2="6" y2="157"/><line x1="26" y1="175" x2="6" y2="172"/><line x1="26" y1="190" x2="6" y2="187"/><line x1="26" y1="205" x2="6" y2="202"/><line x1="26" y1="220" x2="6" y2="217"/><line x1="26" y1="235" x2="6" y2="232"/><line x1="26" y1="250" x2="6" y2="247"/>
      <line x1="94" y1="100" x2="114" y2="97"/><line x1="94" y1="115" x2="114" y2="112"/><line x1="94" y1="130" x2="114" y2="127"/><line x1="94" y1="145" x2="114" y2="142"/><line x1="94" y1="160" x2="114" y2="157"/><line x1="94" y1="175" x2="114" y2="172"/><line x1="94" y1="190" x2="114" y2="187"/><line x1="94" y1="205" x2="114" y2="202"/><line x1="94" y1="220" x2="114" y2="217"/><line x1="94" y1="235" x2="114" y2="232"/><line x1="94" y1="250" x2="114" y2="247"/>
    </g>
    <g stroke="#FB2E71" stroke-width="3" stroke-linecap="round">
      <line x1="28" y1="108" x2="12" y2="112"/><line x1="28" y1="123" x2="12" y2="127"/><line x1="28" y1="138" x2="12" y2="142"/><line x1="28" y1="153" x2="12" y2="157"/><line x1="28" y1="168" x2="12" y2="172"/><line x1="28" y1="183" x2="12" y2="187"/><line x1="28" y1="198" x2="12" y2="202"/><line x1="28" y1="213" x2="12" y2="217"/><line x1="28" y1="228" x2="12" y2="232"/><line x1="28" y1="243" x2="12" y2="247"/>
      <line x1="92" y1="108" x2="108" y2="112"/><line x1="92" y1="123" x2="108" y2="127"/><line x1="92" y1="138" x2="108" y2="142"/><line x1="92" y1="153" x2="108" y2="157"/><line x1="92" y1="168" x2="108" y2="172"/><line x1="92" y1="183" x2="108" y2="187"/><line x1="92" y1="198" x2="108" y2="202"/><line x1="92" y1="213" x2="108" y2="217"/><line x1="92" y1="228" x2="108" y2="232"/><line x1="92" y1="243" x2="108" y2="247"/>
    </g>
    <!-- puntas redondeadas de las cerdas -->
    <g fill="#FF6B9D">
      <circle cx="6" cy="97" r="2.6"/><circle cx="6" cy="112" r="2.6"/><circle cx="6" cy="127" r="2.6"/><circle cx="6" cy="142" r="2.6"/><circle cx="6" cy="157" r="2.6"/><circle cx="6" cy="172" r="2.6"/><circle cx="6" cy="187" r="2.6"/><circle cx="6" cy="202" r="2.6"/><circle cx="6" cy="217" r="2.6"/><circle cx="6" cy="232" r="2.6"/><circle cx="6" cy="247" r="2.6"/>
      <circle cx="114" cy="97" r="2.6"/><circle cx="114" cy="112" r="2.6"/><circle cx="114" cy="127" r="2.6"/><circle cx="114" cy="142" r="2.6"/><circle cx="114" cy="157" r="2.6"/><circle cx="114" cy="172" r="2.6"/><circle cx="114" cy="187" r="2.6"/><circle cx="114" cy="202" r="2.6"/><circle cx="114" cy="217" r="2.6"/><circle cx="114" cy="232" r="2.6"/><circle cx="114" cy="247" r="2.6"/>
    </g>

    <!-- cerdas frontales (textura) -->
    <g fill="#101010" opacity="0.85">
      <circle cx="44" cy="100" r="3.1"/><circle cx="60" cy="100" r="3.1"/><circle cx="76" cy="100" r="3.1"/><circle cx="44" cy="118" r="3.1"/><circle cx="60" cy="118" r="3.1"/><circle cx="76" cy="118" r="3.1"/><circle cx="44" cy="136" r="3.1"/><circle cx="60" cy="136" r="3.1"/><circle cx="76" cy="136" r="3.1"/><circle cx="44" cy="154" r="3.1"/><circle cx="60" cy="154" r="3.1"/><circle cx="76" cy="154" r="3.1"/><circle cx="44" cy="172" r="3.1"/><circle cx="60" cy="172" r="3.1"/><circle cx="76" cy="172" r="3.1"/><circle cx="44" cy="190" r="3.1"/><circle cx="60" cy="190" r="3.1"/><circle cx="76" cy="190" r="3.1"/><circle cx="44" cy="208" r="3.1"/><circle cx="60" cy="208" r="3.1"/><circle cx="76" cy="208" r="3.1"/><circle cx="44" cy="226" r="3.1"/><circle cx="60" cy="226" r="3.1"/><circle cx="76" cy="226" r="3.1"/><circle cx="44" cy="244" r="3.1"/><circle cx="60" cy="244" r="3.1"/><circle cx="76" cy="244" r="3.1"/><circle cx="44" cy="262" r="3.1"/><circle cx="60" cy="262" r="3.1"/><circle cx="76" cy="262" r="3.1"/>
    </g>

    <!-- tapa superior -->
    <ellipse cx="60" cy="88" rx="34" ry="11" fill="#1c1c1c"/>
    <ellipse cx="60" cy="86" rx="22" ry="7" fill="#FB2E71" opacity="0.9"/>
  </g>

</svg>
