      <circle cx="44" cy="100" r="3.1"/><circle cx="60" cy="100" r="3.1"/><circle cx="76" cy="100" r="3.1"/><circle cx="44" cy="118" r="3.1"/><circle cx="60" cy="118" r="3.1"/><circle cx="76" cy="118" r="3.1"/><circle cx="44" cy="136" r="3.1"/><circle cx="60" cy="136" r="3.1"/><circle cx="76" cy="136" r="3.1"/><circle cx="44" cy="154" r="3.1"/><circle cx="60" cy="154" r="3.1"/><circle cx="76" cy="154" r="3.1"/><circle cx="44" cy="172" r="3.1"/><circle cx="60" cy="172" r="3.1"/><circle cx="76" cy="172" r="3.1"/><circle cx="44" cy="190" r="3.1"/><circle cx="60" cy="190" r="3.1"/><circle cx="76" cy="190" r="3.1"/><circle cx="44" cy="208" r="3.1"/><circle cx="60" cy="208" r="3.1"/><circle cx="76" cy="208" r="3.1"/><circle cx="44" cy="226" r="3.1"/><circle cx="60" cy="226" r="3.1"/><circle cx="76" cy="226" r="3.1"/><circle cx="44" cy="244" r="3.1"/><circle cx="60" cy="244" r="3.1"/><circle cx="76" cy="244" r="3.1"/><circle cx="44" cy="262" r="3.1"/><circle cx="60" cy="262" r="3.1"/><circle cx="76" cy="262" r="3.1"/>
    </g>

    <!-- tapa superior -->
    <ellipse cx="60" cy="88" rx="34" ry="11" fill="#1c1c1c"/>
    <ellipse cx="60" cy="86" rx="22" ry="7" fill="#FB2E71" opacity="0.9"/>
  </g>


  <!-- medida lateral: 12.4 inch -->
  <g stroke="#101010" stroke-width="2.5">
    <line x1="300" y1="256" x2="300" y2="640"/>
    <line x1="292" y1="256" x2="308" y2="256"/>
    <line x1="292" y1="640" x2="308" y2="640"/>
  </g>
  <text x="326" y="448" font-family="Arial, sans-serif" font-size="19" font-weight="bold"
        fill="#101010" text-anchor="middle"
        transform="rotate(90 326 448)">12.4 inch</text>

  <!-- etiqueta -->
  <rect x="392" y="96" width="256" height="42" rx="21" fill="#FFE3EC"/>
  <text x="520" y="124" font-family="Arial, sans-serif" font-size="18" font-weight="bold"
        fill="#101010" text-anchor="middle">Product size display</text>

  <!-- detalle del barril en círculo -->
  <circle cx="570" cy="430" r="168" fill="#FFF2F6"/>
  <g transform="translate(492 300) scale(1.35)">
    <rect x="0" y="0" width="116" height="190" rx="58" fill="url(#gBarril)"/>
    <g fill="#FB2E71">
      <circle cx="16" cy="22" r="4.4"/><circle cx="37" cy="22" r="4.4"/><circle cx="58" cy="22" r="4.4"/><circle cx="79" cy="22" r="4.4"/><circle cx="100" cy="22" r="4.4"/><circle cx="16" cy="43" r="4.4"/><circle cx="37" cy="43" r="4.4"/><circle cx="58" cy="43" r="4.4"/><circle cx="79" cy="43" r="4.4"/><circle cx="100" cy="43" r="4.4"/><circle cx="16" cy="64" r="4.4"/><circle cx="37" cy="64" r="4.4"/><circle cx="58" cy="64" r="4.4"/><circle cx="79" cy="64" r="4.4"/><circle cx="100" cy="64" r="4.4"/><circle cx="16" cy="85" r="4.4"/><circle cx="37" cy="85" r="4.4"/><circle cx="58" cy="85" r="4.4"/><circle cx="79" cy="85" r="4.4"/><circle cx="100" cy="85" r="4.4"/><circle cx="16" cy="106" r="4.4"/><circle cx="37" cy="106" r="4.4"/><circle cx="58" cy="106" r="4.4"/><circle cx="79" cy="106" r="4.4"/><circle cx="100" cy="106" r="4.4"/><circle cx="16" cy="127" r="4.4"/><circle cx="37" cy="127" r="4.4"/><circle cx="58" cy="127" r="4.4"/><circle cx="79" cy="127" r="4.4"/><circle cx="100" cy="127" r="4.4"/><circle cx="16" cy="148" r="4.4"/><circle cx="37" cy="148" r="4.4"/><circle cx="58" cy="148" r="4.4"/><circle cx="79" cy="148" r="4.4"/><circle cx="100" cy="148" r="4.4"/><circle cx="16" cy="169" r="4.4"/><circle cx="37" cy="169" r="4.4"/><circle cx="58" cy="169" r="4.4"/><circle cx="79" cy="169" r="4.4"/><circle cx="100" cy="169" r="4.4"/>
    </g>
    <ellipse cx="58" cy="188" rx="30" ry="12" fill="#0a0a0a"/>
  </g>
  <g stroke="#101010" stroke-width="2.5">
    <line x1="492" y1="268" x2="648" y2="268"/>
    <line x1="492" y1="260" x2="492" y2="276"/>
    <line x1="648" y1="260" x2="648" y2="276"/>
  </g>
  <text x="570" y="252" font-family="Arial, sans-serif" font-size="19" font-weight="bold"
        fill="#101010" text-anchor="middle">2.8" BARREL</text>
</svg>
